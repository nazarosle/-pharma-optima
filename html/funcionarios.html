<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pharma Optima | Funcionários</title>
  <link rel="stylesheet" href="../style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-guard.js"></script>
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
    <i class="fa-solid fa-bars"></i>
  </button>
  <aside class="sidebar" id="sidebar">
    <div class="logo"><img src="../img/logo.png" alt="Pharma Optima" /></div>
    <nav>
      <a href="dashboard.html" data-page="dashboard"><i class="fa-solid fa-chart-line"></i><span data-i18n="nav.dashboard">Dashboard</span></a>
      <a href="estoque.html" data-page="estoque"><i class="fa-solid fa-boxes-stacked"></i><span data-i18n="nav.estoque">Estoque</span></a>
      <a href="relatorios.html" data-page="relatorios"><i class="fa-solid fa-chart-pie"></i><span data-i18n="nav.relatorios">Relatórios</span></a>
      <a href="metas.html" data-page="metas"><i class="fa-solid fa-bullseye"></i><span data-i18n="nav.metas">Metas</span></a>
      <a href="funcionarios.html" data-page="funcionarios"><i class="fa-solid fa-users"></i><span data-i18n="nav.funcionarios">Funcionários</span></a>
      <a href="configuracoes.html" data-page="configuracoes"><i class="fa-solid fa-gear"></i><span data-i18n="nav.configuracoes">Configurações</span></a>
    </nav>
  </aside>
  <main class="container">
    <header class="navbar">
      <div class="page-title">
        <h1 data-i18n="page.funcionarios.title">Funcionários</h1>
        <p data-i18n="page.funcionarios.subtitle">Equipe, departamentos e turnos</p>
      </div>
      <div class="nav-right">
        <div class="clock" id="clock">00:00</div>
        <div class="notification"><i class="fa-solid fa-bell"></i><span>3</span></div>
        <button id="themeBtn" aria-label="Alternar tema claro/escuro">🌙</button>
        <div class="profile">
          <img src="../img/manja.jpg" alt="Foto do administrador" />
          <div class="profile-info"><span>Administrador</span><small id="currentUserEmail">Pharma Optima</small></div>
        </div>
        <button id="logoutBtn" onclick="logout()" aria-label="Sair" title="Sair">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <section class="cards">
      <div class="card"><div class="card-icon"><i class="fa-solid fa-users"></i></div><h3>Total de funcionários</h3><p id="statTotalEmployees">0</p></div>
      <div class="card"><div class="card-icon"><i class="fa-solid fa-user-check"></i></div><h3>Presentes hoje</h3><p id="statPresentToday">0</p></div>
      <div class="card"><div class="card-icon"><i class="fa-solid fa-user-xmark"></i></div><h3>Ausentes hoje</h3><p id="statAbsentToday">0</p></div>
      <div class="card"><div class="card-icon"><i class="fa-solid fa-people-group"></i></div><h3>Equipe cadastrada</h3><p>Ativa</p></div>
    </section>
    <div class="filter-bar">
      <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="tableSearch" data-i18n-placeholder="common.buscar" placeholder="Buscar..." /></div>
      <select id="statusFilter">
        <option value="all">Todos os departamentos</option>
        <option value="produção">Produção</option><option value="pesquisa">Pesquisa</option>
        <option value="qualidade">Qualidade</option><option value="vendas">Vendas</option>
      </select>
    </div>
    <section class="table-card">
      <div class="table-header"><h3>Equipe</h3><button id="btnAddEmployee"><i class="fa-solid fa-plus"></i><span data-i18n="common.novoFuncionario">Novo funcionário</span></button></div>
      <table>
        <thead><tr><th>Nome</th><th>Cargo</th><th>Departamento</th><th>Turno</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="employeesTableBody"></tbody>
      </table>
    </section>
  </main>
  <div class="modal-overlay" id="employeeModal">
    <div class="modal-box">
      <div class="modal-header"><h3 id="employeeModalTitle">Novo funcionário</h3><button class="modal-close" data-close-modal="employeeModal">&times;</button></div>
      <form id="employeeForm">
        <input type="hidden" id="employeeId" />
        <div class="modal-grid">
          <label class="settings-field"><span>Nome</span><input type="text" id="employeeName" required /></label>
          <label class="settings-field"><span>Cargo</span><input type="text" id="employeeRole" required /></label>
          <label class="settings-field"><span>Departamento</span>
            <select id="employeeDept" required><option>Produção</option><option>Pesquisa</option><option>Qualidade</option><option>Vendas</option></select>
          </label>
          <label class="settings-field"><span>Turno</span>
            <select id="employeeShift" required><option>Manhã</option><option>Tarde</option><option>Noite</option></select>
          </label>
          <label class="settings-field"><span>Status</span>
            <select id="employeeStatus" required><option>Presente</option><option>Ausente</option></select>
          </label>
        </div>
        <div class="modal-footer"><button type="button" class="btn-outline" data-close-modal="employeeModal">Cancelar</button><button type="submit" class="btn-primary">Salvar</button></div>
      </form>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
