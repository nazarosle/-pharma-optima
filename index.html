<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pharma Optima | Entrar</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <style>

    .login-wrap{
      width:100%;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .login-box{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:40px;
      width:100%;
      max-width:400px;
    }

    .login-logo{
      display:flex;
      justify-content:center;
      margin-bottom:10px;
    }

    .login-logo img{
      width:140px;
      border-radius:12px;
    }

    .login-box h1{
      text-align:center;
      font-size:1.4rem;
      margin-bottom:6px;
    }

    .login-box p.subtitle{
      text-align:center;
      color:var(--soft);
      font-size:0.9rem;
      margin-bottom:28px;
    }

    .login-field{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:18px;
    }

    .login-field span{
      font-size:0.85rem;
      color:var(--soft);
    }

    .login-field input{
      background:var(--bg);
      color:var(--text);
      border:1px solid var(--border);
      padding:13px 16px;
      border-radius:12px;
      font-size:14px;
    }

    .login-error{
      background:rgba(239,68,68,0.12);
      color:var(--danger);
      padding:12px 14px;
      border-radius:12px;
      font-size:0.85rem;
      margin-bottom:18px;
      display:none;
    }

    .login-error.show{
      display:block;
    }

    .login-submit{
      width:100%;
      border:none;
      background:var(--primary);
      color:white;
      padding:14px;
      border-radius:12px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
    }

    .login-submit:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }

    .login-forgot{
      text-align:center;
      margin-top:18px;
      font-size:0.85rem;
    }

    .login-forgot a{
      color:var(--primary);
      text-decoration:none;
      cursor:pointer;
    }

  </style>

</head>

<body class="light-off">

  <div class="login-wrap">
    <div class="login-box">

      <div class="login-logo">
        <img src="img/logoDark.png" alt="Pharma Optima" />
      </div>

      <h1>Pharma Optima</h1>
      <p class="subtitle">Entre com sua conta para acessar o painel</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">

        <label class="login-field">
          <span>E-mail</span>
          <input type="email" id="loginEmail" required autocomplete="username" />
        </label>

        <label class="login-field">
          <span>Senha</span>
          <input type="password" id="loginPassword" required autocomplete="current-password" />
        </label>

        <button type="submit" class="login-submit" id="loginSubmitBtn">Entrar</button>

      </form>

      <p class="login-forgot">
        <a id="forgotPasswordLink">Esqueci minha senha</a>
      </p>

    </div>
  </div>

  <script>

    // Se já estiver logado, pula direto pro dashboard
    auth.onAuthStateChanged((user) => {
      if (user) window.location.href = "html/dashboard.html";
    });

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const submitBtn = document.getElementById("loginSubmitBtn");

    function showError(message){
      errorBox.textContent = message;
      errorBox.classList.add("show");
    }

    const ERROR_MESSAGES = {
      "auth/invalid-email": "E-mail inválido.",
      "auth/user-not-found": "Não encontramos uma conta com esse e-mail.",
      "auth/wrong-password": "Senha incorreta.",
      "auth/invalid-credential": "E-mail ou senha incorretos.",
      "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo."
    };

    form.addEventListener("submit", (e) => {

      e.preventDefault();

      errorBox.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Entrando...";

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = "html/dashboard.html";
        })
        .catch((err) => {
          showError(ERROR_MESSAGES[err.code] || "Não foi possível entrar. Tente novamente.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Entrar";
        });

    });

    document.getElementById("forgotPasswordLink").addEventListener("click", () => {

      const email = document.getElementById("loginEmail").value.trim();

      if (!email) {
        showError("Digite seu e-mail no campo acima primeiro, depois clique em \"Esqueci minha senha\".");
        return;
      }

      auth.sendPasswordResetEmail(email)
        .then(() => {
          errorBox.classList.remove("show");
          alert("Enviamos um link de redefinição de senha para " + email);
        })
        .catch((err) => {
          showError(ERROR_MESSAGES[err.code] || "Não foi possível enviar o e-mail de redefinição.");
        });

    });

  </script>

</body>

</html>
